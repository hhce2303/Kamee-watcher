[package]
name = "the-watcher"
version = "0.1.0"
edition = "2021"
description = "The Watcher — Tauri 2 shell"

[lib]
name = "the_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2" }
tauri-plugin-shell = { version = "2" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["full"] }
anyhow            = "1"
log               = "0.4"

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
